name: CI

on:
  push:
  pull_request:

jobs:
  deterministic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned Stage 1 starter kit and verify tools
        run: bash scripts/bootstrap_upstream.sh

      - name: Bootstrap pinned Stage 2 starter kit and verify 51 checks
        run: bash scripts/bootstrap_stage2.sh

      - name: Validate frontend JavaScript syntax
        run: node --check web/app.js

      - name: Run project tests
        run: python -m pytest tests -q

      - name: Dry-run Stage 1 live eval matrix
        run: python run_evals.py --dry-run
