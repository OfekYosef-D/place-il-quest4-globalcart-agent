name: CI

on:
  push:
  pull_request:

jobs:
  deterministic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned upstream starter kit and verify tools
        run: bash scripts/bootstrap_upstream.sh

      - name: Run project tests
        run: python -m pytest tests -q

      - name: Dry-run live eval matrix
        run: python run_evals.py --dry-run
